<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a18">
  <title>Captura — FacturApp</title>
  <link rel="manifest" href="./json/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/captura.css">
</head>
<body>
  <header class="app-header">
    <button class="btn-icon" id="btn-back" title="Volver">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <span class="app-header__logo">Captura de factura</span>
    <div style="width:36px;"></div>
  </header>

  <main class="capture-main">
    <div class="camera-wrap" id="camera-wrap">
      <video id="video" autoplay playsinline></video>
      <div class="camera-overlay">
        <div class="camera-frame"></div>
        <p class="camera-hint">Encuadrá la factura dentro del recuadro</p>
      </div>
      <button class="btn-capture" id="btn-capture" title="Capturar">
        <span class="btn-capture__ring"></span>
        <span class="btn-capture__dot"></span>
      </button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <div class="preview-wrap hidden" id="preview-wrap">
      <img id="preview-img" alt="Factura capturada">
      <div class="preview-actions">
        <button class="btn-secondary" id="btn-retomar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Retomar
        </button>
        <button class="btn-primary" id="btn-procesar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Usar esta imagen
        </button>
      </div>
    </div>

    <div class="processing-wrap hidden" id="processing-wrap">
      <div class="spinner"></div>
      <p class="processing-text">Procesando factura con OCR…</p>
    </div>

    <div class="result-wrap hidden" id="result-wrap">
      <div class="card">
        <p class="section-label">Datos detectados en la factura</p>
        <div class="ocr-grid" id="ocr-grid"></div>
        <hr class="divider">
        <p class="section-label">Datos del formulario</p>
        <div class="form-summary" id="form-summary"></div>
        <hr class="divider">
        <div id="result-error" class="alert alert--error hidden"></div>
        <button class="btn-primary" id="btn-guardar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Guardar en Excel
        </button>
      </div>
    </div>

    <div class="success-wrap hidden" id="success-wrap">
      <div class="success-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <h2 class="success-title">¡Factura guardada!</h2>
      <p class="success-sub">Los datos fueron guardados en el Excel.</p>
      <button class="btn-primary" id="btn-nueva">Cargar otra factura</button>
    </div>
  </main>

  <script src="./javascript/captura.js"></script>
</body>
</html>
