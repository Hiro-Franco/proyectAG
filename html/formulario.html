<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a18">
  <title>Clasificación — FacturApp</title>
  <link rel="manifest" href="../json/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/formulario.css">
</head>
<body>
  <header class="app-header">
    <span class="app-header__logo">FacturApp</span>
    <button class="btn-icon" id="btn-logout" title="Cerrar sesión">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>

  <main class="main-content">
    <div class="card">
      <p class="section-label">Identificación</p>

      <div class="field">
        <label for="fecha">Fecha de emisión</label>
        <input id="fecha" type="date">
      </div>
      <div class="field">
        <label for="razon">Razón social <span class="required">*</span></label>
        <input id="razon" type="text" placeholder="Nombre legal del emisor">
      </div>
      <div class="field">
        <label for="emisor">Nombre comercial / Proveedor</label>
        <input id="emisor" type="text" placeholder="Nombre de fantasía o contacto">
      </div>

      <hr class="divider">
      <p class="section-label">Categoría</p>

      <div class="field">
        <label for="categoria">Categoría de la factura <span class="required">*</span></label>
        <select id="categoria">
          <option value="" disabled selected>— Seleccioná una categoría —</option>
          <optgroup label="General">
            <option value="Premios">Premios</option>
            <option value="Mantenimiento">Mantenimiento</option>
            <option value="Limpieza">Limpieza</option>
            <option value="Combustible">Combustible</option>
            <option value="Librería">Librería</option>
            <option value="Kiosco">Kiosco</option>
            <option value="Seguridad">Seguridad</option>
            <option value="Comedor">Comedor</option>
            <option value="Gasto de estructura">Gasto de estructura</option>
          </optgroup>
          <optgroup label="Producción agropecuaria">
            <option value="Apicultura">Apicultura</option>
            <option value="Monte frutal">Monte frutal</option>
            <option value="Conejos">Conejos</option>
            <option value="Ponedoras">Ponedoras</option>
            <option value="Agro alimentos">Agro alimentos</option>
            <option value="Porcinos">Porcinos</option>
            <option value="Ovinos">Ovinos</option>
            <option value="Bovinos">Bovinos</option>
            <option value="Huerta">Huerta</option>
            <option value="Vivero">Vivero</option>
            <option value="Forrajes">Forrajes</option>
            <option value="Faena">Faena</option>
          </optgroup>
          <optgroup label="Infraestructura y taller">
            <option value="Taller rural">Taller rural</option>
            <option value="Mecánica agrícola">Mecánica agrícola</option>
            <option value="Máquinas e instalaciones">Máquinas e instalaciones</option>
            <option value="Pañol">Pañol</option>
          </optgroup>
        </select>
      </div>

      <hr class="divider">
      <p class="section-label">Método de pago</p>

      <div class="field">
        <div class="toggle-row">
          <button type="button" class="toggle-btn" data-val="Efectivo" onclick="setPago(this)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/></svg>
            Efectivo
          </button>
          <button type="button" class="toggle-btn" data-val="Transferencia" onclick="setPago(this)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l4-4 4 4M7 5v14"/><path d="M21 15l-4 4-4-4"/><path d="M17 19V5"/></svg>
            Transferencia
          </button>
        </div>
        <div class="transferencia-extra hidden" id="transferencia-extra">
          <div class="row2">
            <div class="field field--inline">
              <label for="banco">Banco / entidad</label>
              <input id="banco" type="text" placeholder="Ej: Galicia, Mercado Pago…">
            </div>
            <div class="field field--inline">
              <label for="cbu">CBU / CVU (opcional)</label>
              <input id="cbu" type="text" placeholder="22 dígitos" inputmode="numeric">
            </div>
          </div>
        </div>
      </div>

      <hr class="divider">
      <p class="section-label">Observaciones</p>

      <div class="field">
        <label for="notas">Notas</label>
        <textarea id="notas" rows="3" placeholder="Información adicional sobre esta factura…"></textarea>
      </div>

      <div id="form-error" class="alert alert--error hidden"></div>

      <button type="button" class="btn-primary" id="btn-continuar">
        Continuar a captura
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </main>

  <script src="../javascript/formulario.js"></script>
</body>
</html>
