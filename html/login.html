<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a18">
  <title>Acceso — FacturApp</title>
  <link rel="manifest" href="./json/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="16 1 16 17 8 17 8 1"/></svg>
    </div>
    <h1 class="auth-title">FacturApp</h1>
    <p class="auth-subtitle">Ingresá tus credenciales para continuar</p>
    <div id="login-error" class="alert alert--error hidden"></div>
    <div class="field">
      <label for="username">Usuario</label>
      <input id="username" type="text" placeholder="Tu usuario" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="btn-login">Ingresar</button>
  </div>
  <script src="./javascript/login.js"></script>
</body>
</html>
